<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Online Restaurant</title>
    <link rel="stylesheet" href="style77.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <header>
        <h1>🍽 Online Restaurant</h1>
        <a href="cart.html" class="cart-link">
            🛒 View Cart

            <span class="badge bg-danger" id="quantity"></span>
        </a>
    </header>

    <section class="mb-3 container">
        <div class="row">
            <div class="col-md-2">
                <select id="categoryFilter" class="form-select">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="spiceFilter" class="form-select">
                    <option value="">Spice Level</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <div class="col-md-2">
                <label><input type="checkbox" id="nutsFilter" class="form-check-input"> With Nuts</label>
                <label><input type="checkbox" id="vegFilter" class="form-check-input"> Vegetarian</label>
            </div>
        </div>
    </section>

    <div class="container">
        <section id="dishesContainer" class="grid"></section>
    </div>

    <script src="api.js"></script>
    <script src="main.js"></script>
</body>

</html>
