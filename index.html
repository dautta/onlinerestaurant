
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🍽 Online Restaurant</h1>
    <a href="cart.html" class="cart-link">🛒 View Cart</a>
</header>

<section class="filters">
    <select id="categoryFilter">
        <option value="">All Categories</option>
    </select>

    <select id="spiceFilter">
        <option value="">Spice Level</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>

    <label><input type="checkbox" id="nutsFilter"> With Nuts</label>
    <label><input type="checkbox" id="vegFilter"> Vegetarian</label>
</section>

<section id="dishesContainer" class="grid"></section>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
