<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="style77.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <header>
        <h1>🛒 Your Cart</h1>
        <a href="index.html" class="cart-link">⬅ Back to Menu</a>
    </header>

    <section id="container">
        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>#</th>
                    <th>კერძი</th>
                    <th>ფასი</th>
                    <th>ქმედება</th>
                </tr>
            </thead>
            <tbody id="products">

            </tbody>
        </table>
        <h2>Total: <span id="totalPrice">0</span> ₾</h2>

        <div class="w-25">
            <button type="button" class="btn btn-success" onclick="purchase()">შეკვეთის დადასტურება</button>
        </div>
    </section>


    <script src="cart.js"></script>
</body>

</html>
